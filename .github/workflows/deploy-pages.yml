name: Deploy to GitHub Pages

# The Pages site for this repo is served from the gh-pages branch (enabled
# automatically when the branch was first pushed). The Actions GITHUB_TOKEN
# cannot switch the Pages source to "GitHub Actions" (that needs repo-admin),
# so this workflow simply mirrors main into gh-pages — GitHub's built-in
# "pages build and deployment" then publishes it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow one: the mirror below is a plain
      # fast-forward push, and git can only prove a fast-forward if it holds
      # the ancestry. With fetch-depth 1 it does not, and the push is rejected
      # with "(fetch first)" — which is what silently broke the deploy on
      # 25.09.26, the first day main advanced by a merge commit rather than a
      # straight line.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror main to gh-pages
        run: |
          git fetch origin gh-pages
          git push origin HEAD:gh-pages
