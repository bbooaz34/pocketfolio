# Daily price snapshot (POCKETFOLIO-PRICING.md §5).
# Prices data/watchlist.json via PriceCharting (+ PPT fallback) and commits
# the result under data/. GITHUB_TOKEN pushes do NOT trigger other workflows,
# so deploy-pages.yml never sees the data commit — the gh-pages mirror is a
# step of this job instead.
#
# Secrets: PRICECHARTING_TOKEN (optional but primary), PPT_TOKEN (fallback).
name: price snapshot
on:
  # 20:00 UTC. The provider refreshes a card's market data in the evening UTC
  # (the one full timestamp seen so far: 2026-09-17T18:38:35Z), so a 04:00 run
  # carried the PREVIOUS evening's data — about nine hours stale on arrival.
  # Running after the provider's cycle puts that same day's refresh in that
  # day's snapshot. Kept four hours clear of midnight UTC because GitHub's
  # scheduler runs cron late, sometimes by hours: the 04:00 job fired at 09:05
  # on 20.09, and a delay that size must not push the run onto the next date.
  schedule: [{ cron: '0 20 * * *' }]   # 20:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-snapshot.mjs
        env:
          PC_TOKEN:  ${{ secrets.PRICECHARTING_TOKEN }}
          PPT_TOKEN: ${{ secrets.PPT_TOKEN }}
      - run: node scripts/prune-snapshots.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'prices: snapshot ${{ github.run_id }}'
          file_pattern: 'data/**'
      - name: Mirror to gh-pages
        run: git push origin HEAD:gh-pages
