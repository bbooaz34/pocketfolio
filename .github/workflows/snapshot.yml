# Daily price snapshot (POCKETFOLIO-PRICING.md §5).
# Prices data/watchlist.json via PriceCharting (+ PPT fallback) and commits
# the result under data/. GITHUB_TOKEN pushes do NOT trigger other workflows,
# so deploy-pages.yml never sees the data commit — the gh-pages mirror is a
# step of this job instead.
#
# Secrets: PRICECHARTING_TOKEN (optional but primary), PPT_TOKEN (fallback).
name: price snapshot
on:
  # 20:00 UTC. NOT because the provider has an evening batch — it does not.
  # Full timestamps across the watchlist land at 02, 07, 07, 07, 09, 11, 12,
  # 12, 15, 16, 16, 17, 18, 19, 20, 21 and 22 UTC: it refreshes cards around
  # the clock, and the single 18:38 sample this hour was first chosen from was
  # a coincidence. The reason that survives is duller and still holds — the
  # later in the day we build, the more of that day's refreshes we have caught.
  # On 23.09 five cards refreshed between 07:07 and 16:04; a 20:00 build has
  # all five, a 04:00 build would have carried the previous day's data for
  # every one of them. Kept four hours clear of midnight UTC because GitHub
  # runs cron late, sometimes by hours: the 04:00 job fired at 09:06 on 23.09,
  # and a delay that size must not push the run onto the next date.
  schedule: [{ cron: '0 20 * * *' }]   # 20:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: snapshot
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-snapshot.mjs
        env:
          PC_TOKEN:  ${{ secrets.PRICECHARTING_TOKEN }}
          PPT_TOKEN: ${{ secrets.PPT_TOKEN }}
      - run: node scripts/prune-snapshots.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'prices: snapshot ${{ github.run_id }}'
          file_pattern: 'data/**'
      - name: Mirror to gh-pages
        run: git push origin HEAD:gh-pages
